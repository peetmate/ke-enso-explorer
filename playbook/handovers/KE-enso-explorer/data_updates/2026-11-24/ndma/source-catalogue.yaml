id: kenya-ndma-bulletin-index
title: NDMA KnowledgeWeb county and national drought bulletin document index, Kenya
description: Index of publisher document identifiers, titles, reference periods and
  official links harvested from NDMA KnowledgeWeb. This record covers document metadata
  only; it does not contain bulletin text, charts or extracted drought measurements.
resource_type: dataset
license: LicenseRef-NDMA-Permission-Pending
access: non-public
access_note: Local catalogue evidence only. No catalogue submission, public hosting
  or redistribution approval is implied.
keywords:
- Kenya
- source provenance
- local research extract
note: Local rights assessment records the pending NDMA publication process; it is
  not a licence grant. Permission for the wider NDMA-derived valuation assets remains
  pending, with their existing Beta restrictions unchanged. This index links to publisher-hosted
  documents and does not mirror PDFs. Upload date and bulletin reference period are
  different fields. Unparsed periods and unresolved county labels remain null; missing
  documents do not establish that no bulletin was issued. Distinct document UUID is
  the primary key; repeated source listings are reconciled by the harvest validation.
